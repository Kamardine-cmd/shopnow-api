name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: shopnow-api

jobs:
  secrets-scan:
    name: scan secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Récuperer le code avec tout le historique
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Réchercher des secrets avec gitleaks
        run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --verbose --redact

  lint:
    name: Lint du Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - name: Récuperer le code
        uses: actions/checkout@v5

      - name: Analyser le Dockerfile avec hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

  build:
    name: Build de l'image
    needs: [lint, secrets-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Récuperer le code
        uses: actions/checkout@v5

      - name: Construire l'image Docker
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Vérifier que l'image ne tourne pas en root
        run: |
          USER_IN_IMAGE=$(docker run --rm "$IMAGE_NAME:${{ github.sha }}" whoami)
          echo "l'utilisateur dans l'image : $USER_IN_IMAGE"
          [ "$USER_IN_IMAGE" != "root" ] || { echo "ERREUR : l'image tourne en root, c'est interdit chez ShopNow"; exit 1; }

      - name: Exporter l'image dans un fichier
        run: docker save "$IMAGE_NAME:${{ github.sha }}" -o image.tar

      - name: Publier l'image comme artefact
        uses: actions/upload-artifact@v6
        with:
          name: image-docker
          path: image.tar
          retention-days: 1

  scan-image:
    name: Scan des vulnerabilités
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Récuperer l'image
        uses: actions/download-artifact@v7
        with:
          name: image-docker

      - name: Générer le rapport complet avec Trivy
        run: docker run --rm -v "$PWD":/work aquasec/trivy:0.57.1 image --input /work/image.tar --format table --output /work/trivy-report.txt

      - name: Publier le rapport
        uses: actions/upload-artifact@v6
        with:
          name: rapport-trivy
          path: trivy-report.txt
          retention-days: 7

      - name: Bloquer en cas de vulnérabilité CRITICAL
        run: docker run --rm -v "$PWD":/work aquasec/trivy:0.57.1 image --input /work/image.tar --severity CRITICAL --exit-code 1

  deploy-recette:
    name: Deploiement recette
    needs: scan-image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: recette
    concurrency:
      group: deploy-recette
      cancel-in-progress: false
    steps:
      - name: Récuperer l'image construite par la CI
        uses: actions/download-artifact@v7
        with:
          name: image-docker

      - name: Charger l'image
        run: docker load -i image.tar

      - name: Deployer l'image
        run: docker run -d -p 8000:8000 -e "APP_ENV=${{ vars.APP_ENV }}" --name api "$IMAGE_NAME:${{ github.sha }}"

      - name: Diagnostiquer le conteneur
        if: always()
        run: |
          docker ps -a
          docker logs api
          docker exec api sh -c "wget -S -O- http://127.0.0.1:8000/ || true"

      - name: Smoke test
        run: |
          RESPONSE=$(curl --fail --silent --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/)
          echo "Réponse de l'application : $RESPONSE"
          echo "$RESPONSE" | grep -q "\"env\":\"${{ vars.APP_ENV }}\"" || { echo "ERREUR : l'application ne tourne pas avec la bonne configuration"; exit 1; }

  deploy-production:
    name: Déploiement production
    needs: deploy-recette
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: "production"
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Récuperer l'image construite par la CI
        uses: actions/download-artifact@v7
        with:
          name: image-docker

      - name: Charger l'image
        run: docker load -i image.tar

      - name: Déployer (simulation)
        run: docker run -d -p 8000:8000 -e APP_ENV=${{ vars.APP_ENV }} --name api "$IMAGE_NAME:${{ github.sha }}"

      - name: Diagnostiquer le conteneur
        if: always()
        run: |
          docker ps -a
          docker logs api

      - name: Smoke test
        run: |
          RESPONSE=$(curl --fail --silent --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/)
          echo "Réponse de l'application : $RESPONSE"
          echo "$RESPONSE" | grep -q "\"env\":\"${{ vars.APP_ENV }}\"" || { echo "ERREUR : l'application ne tourne pas avec la bonne configuration"; exit 1; }
